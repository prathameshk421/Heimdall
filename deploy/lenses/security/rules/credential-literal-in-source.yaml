rules:
  - id: credential-literal-in-source
    languages: [generic]
    severity: WARNING
    message: >-
      A credential is written into the source. Read it from the environment or the secret store at run time, so it is
      not in every clone, every build image and every log of a command line.
    paths:
      include:
        - "**/*.go"
        - "**/*.py"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.java"
        - "**/*.rb"
        - "**/*.php"
        - "**/*.cs"
        - "**/*.kt"
      exclude:
        - "**/rules/testdata/**"
    patterns:
      - pattern-regex: >-
          (?i)\b(password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|credentials?)\b[ \t]*[:=]{1,2}[ \t]*["'][^"'\n]{6,}["']
    metadata:
      category: security
      technology: [secrets]
      confidence: MEDIUM
