rules:
  - id: credential-in-log-line
    languages: [generic]
    severity: WARNING
    message: >-
      A credential reaches a log line. A log is kept longer than the secret lives and is read by more people, so log
      the shape of the value and never the value.
    paths:
      include:
        - "**/*.go"
        - "**/*.py"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.java"
        - "**/*.rb"
        - "**/*.php"
        - "**/*.cs"
        - "**/*.kt"
      exclude:
        - "**/rules/testdata/**"
    patterns:
      - pattern-regex: >-
          (?i)\b(log|logger|logging|slog|zerolog|zap|fmt\.Print(f|ln)?|print|console\.(log|error|warn|info))\b[^\n]*\b(password|passwd|secret|token|api[_-]?key|authorization|credentials?)\b
    metadata:
      category: security
      technology: [logging]
      confidence: MEDIUM
