rules:
  - id: openapi-public-endpoint
    languages: [generic]
    severity: WARNING
    message: >-
      This route declares an empty security requirement, which means it is open to everyone. Say who may call it, or
      say in a comment why it is open.
    paths:
      # The fixture of this rule cannot end in .yml: the engine loads every YAML file in the rule folder as a rule
      # file, and the fixture would shadow itself. It ends in .openapi instead, which is why that glob is here.
      include:
        - "**/openapi*.y*ml"
        - "**/openapi*.json"
        - "**/*.openapi"
      exclude:
        - "**/rules/testdata/**"
    patterns:
      - pattern-regex: '(?m)^[ \t]*security:[ \t]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+-[ \t]*\{\s*\}'
    metadata:
      category: contract
      technology: [openapi]
      confidence: MEDIUM
