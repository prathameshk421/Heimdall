rules:
  - id: python-no-sleep
    languages: [python]
    severity: WARNING
    message: >-
      The test waits on the clock. It passes on a fast machine and fails on a slow one. Wait for the thing instead.
    paths:
      exclude:
        - "**/rules/testdata/**"
    patterns:
      - pattern-regex: '(?m)\b(?:time\.sleep|asyncio\.sleep)\('
    metadata:
      category: tests
      technology: [python]
      confidence: HIGH
