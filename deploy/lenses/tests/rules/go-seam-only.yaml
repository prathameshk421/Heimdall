rules:
  - id: go-seam-only
    languages: [go]
    severity: WARNING
    message: >-
      The test imports a package the product keeps to itself. Call the product over its seam instead, so the test
      survives a refactor of the inside.
    paths:
      exclude:
        - "**/rules/testdata/**"
    patterns:
      - pattern-regex: '(?m)^\s*(?:[A-Za-z0-9_]+[ \t]+)?"[^"]*/internal/[^"]*"'
    metadata:
      category: tests
      technology: [go]
      confidence: MEDIUM
