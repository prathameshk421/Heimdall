# Graphiti MCP server config for deploy/compose.yaml (D66, D73, D87; TECH_SPEC section 12, memory stack).
# It follows the layout of config/config-docker-falkordb.yaml in the zepai/knowledge-graph-mcp standalone image,
# Extraction runs on Deploy (OpenAI-compatible). Embeddings run on the local embeddings service (Text Embeddings
# Inference with BAAI/bge-small-en-v1.5), because Deploy offers no embedding model (D163, Nov 8 2026).
# The Deploy key is not in this file: the compose command reads it from the deploy_api_key Docker secret.

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: "deepseek-ai/deepseek-v4.1-flash-1017"
  max_tokens: 4096
  # Deploy documents no JSON schema mode, so the schema goes into the prompt and the reply is plain JSON.
  structured_output_mode: "json_object"
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: "https://api.deploy.com/api/v1"

embedder:
  provider: "openai"
  model: "BAAI/bge-small-en-v1.5"
  dimensions: 384
  providers:
    openai:
      # The local embeddings service checks no key, but the client needs a value.
      api_key: "local"
      api_url: "http://embeddings:80/v1"

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: "redis://falkordb:6379"
      password: ""
      database: "default_db"

graphiti:
  group_id: "main"
  user_id: "mcp_user"
  entity_types:
    - name: "Component"
      description: "A service, package, file, or function in the code under review"
    - name: "Invariant"
      description: "A rule that must always hold in the code, such as a cap, an order of steps, or a data constraint"
    - name: "Incident"
      description: "A failure that happened, with its cause and the component it hit"
    - name: "Decision"
      description: "A choice a person made, such as upholding or dismissing a finding, with the reason they gave"
    - name: "Requirement"
      description: "A need from a ticket or spec that the change must meet"
    - name: "Procedure"
      description: "A standard step-by-step way of working, such as how to release or how to roll back"
