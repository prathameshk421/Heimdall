# Heimdall proof (ACTION_MODE.md 3.2, 4.4, 5.2). It runs PR code, but only as the sandbox user heimdall-sbx. The model
# key is set on the proof step alone, and only for a pull request from this repository: a fork or Dependabot run gets
# no key, and the proof says so. The token is read-only. Add no step to this job: any PR-controlled process that runs
# as the runner user can read the key (3.2 rule 4).
name: Heimdall proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read # the pull request, its files and its comments

concurrency:
  group: heimdall-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof:
    name: Heimdall proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The head commit, as files. No credentials stay in .git, and the sandbox copy excludes .git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Build heimdall before any toolchain of the PR is on PATH, and before any secret is in the environment.
      - uses: prathameshk421/Heimdall/deploy/action@0000000000000000000000000000000000000000 # heimdall-pin
        with:
          step: install
      # The PR's Go version is read from its go.mod as data. The sandbox runs the tests with this toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          cache: false
      - uses: prathameshk421/Heimdall/deploy/action@0000000000000000000000000000000000000000 # heimdall-pin
        with:
          step: trigger
      - uses: prathameshk421/Heimdall/deploy/action@0000000000000000000000000000000000000000 # heimdall-pin
        with:
          step: proof
          model-base-url: ${{ vars.HEIMDALL_MODEL_BASE_URL || 'https://openrouter.ai/api/v1' }}
          model: ${{ vars.HEIMDALL_MODEL }}
          model-price-input: ${{ vars.HEIMDALL_MODEL_PRICE_INPUT }}
          model-price-cached-input: ${{ vars.HEIMDALL_MODEL_PRICE_CACHED_INPUT }}
          model-price-output: ${{ vars.HEIMDALL_MODEL_PRICE_OUTPUT }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEIMDALL_MODEL_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.HEIMDALL_MODEL_KEY || '' }}
      # Upload what the steps wrote, also after a failure or a cancel, so the gate can say why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heimdall-event
          path: ${{ runner.temp }}/heimdall-out/heimdall-event.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heimdall-proof
          path: ${{ runner.temp }}/heimdall-out/heimdall-proof.json
          if-no-files-found: warn
          retention-days: 7
