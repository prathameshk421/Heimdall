# Heimdall Action mode: one composite action for the three workflows of ACTION_MODE.md 3.2.
#
# The action builds the heimdall binary from its own source: GitHub downloads this repository at the commit the
# caller pins in `uses: <owner>/<repo>/deploy/action@<full sha>`, so the binary is exactly that commit. A released
# binary with a checksum in this file can replace the build later; the inputs stay the same.
#
# Secrets never come in as inputs. The calling workflow passes GITHUB_TOKEN, HEIMDALL_LOG_KEY and HEIMDALL_MODEL_KEY
# with `env:` on the one step that needs them. The binary reads the event from GITHUB_EVENT_PATH, never from an
# expression in a script (ACTION_MODE 3.1).
name: Heimdall
description: Run one Heimdall Action mode step (install, trigger, proof or gate).
author: Heimdall
branding:
  icon: shield
  color: gray-dark

inputs:
  step:
    description: "The step to run: install (build only), trigger, proof or gate."
    required: true
  model-base-url:
    description: "Any OpenAI-compatible base URL for the proof step."
    required: false
    default: "https://openrouter.ai/api/v1"
  model:
    description: "The model id for the proof step."
    required: false
    default: ""
  model-price-input:
    description: "The model's input price in USD per million tokens. The cost cap needs it."
    required: false
    default: ""
  model-price-cached-input:
    description: "The model's cached input price in USD per million tokens."
    required: false
    default: ""
  model-price-output:
    description: "The model's output price in USD per million tokens. The cost cap needs it."
    required: false
    default: ""

outputs:
  record:
    description: "The file the trigger or proof step wrote, under RUNNER_TEMP/heimdall-out."
    value: ${{ steps.run.outputs.record }}

runs:
  using: composite
  steps:
    - name: Find the heimdall binary
      id: find
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/heimdall-bin/heimdall"
        if [ -x "$bin" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

    - name: Set up Go for the heimdall build
      if: steps.find.outputs.have != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false

    - name: Build heimdall from the pinned source
      if: steps.find.outputs.have != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        CGO_ENABLED: "0"
        GOFLAGS: "-mod=readonly"
        GOTOOLCHAIN: "local"
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/heimdall-bin"
        go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/heimdall-bin/heimdall" ./cmd/heimdall
        sha256sum "$RUNNER_TEMP/heimdall-bin/heimdall"

    - name: Run heimdall action
      id: run
      if: inputs.step != 'install'
      shell: bash
      env:
        HEIMDALL_STEP: ${{ inputs.step }}
        HEIMDALL_MODEL_BASE_URL: ${{ inputs.model-base-url }}
        HEIMDALL_MODEL: ${{ inputs.model }}
        HEIMDALL_MODEL_PRICE_INPUT: ${{ inputs.model-price-input }}
        HEIMDALL_MODEL_PRICE_CACHED_INPUT: ${{ inputs.model-price-cached-input }}
        HEIMDALL_MODEL_PRICE_OUTPUT: ${{ inputs.model-price-output }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/heimdall-bin/heimdall"
        out="$RUNNER_TEMP/heimdall-out"
        mkdir -p "$out"
        case "$HEIMDALL_STEP" in
          trigger)
            echo "record=$out/heimdall-event.json" >> "$GITHUB_OUTPUT"
            exec "$bin" action trigger -out "$out/heimdall-event.json" ;;
          proof)
            # The sandbox runs the PR's tests with the Go toolchain the workflow set up, then the system tools.
            if [ -z "${HEIMDALL_SANDBOX_PATH:-}" ] && command -v go >/dev/null 2>&1; then
              HEIMDALL_SANDBOX_PATH="$(dirname "$(command -v go)"):/usr/bin:/bin"
              export HEIMDALL_SANDBOX_PATH
            fi
            echo "record=$out/heimdall-proof.json" >> "$GITHUB_OUTPUT"
            exec "$bin" action proof -out "$out/heimdall-proof.json" ;;
          gate)
            exec "$bin" action gate ;;
          *)
            echo "heimdall action: step must be install, trigger, proof or gate" >&2
            exit 2 ;;
        esac
