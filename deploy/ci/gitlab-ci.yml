# Heimdall GitLab CI template (Stage C5 foundation).
#
# Include from your `.gitlab-ci.yml`:
#   include:
#     - local: 'deploy/ci/gitlab-ci.yml'
#
# Required CI/CD variables (masked, protected where appropriate):
#   HEIMDALL_VERSION   - pinned Heimdall release tag or commit
#   HEIMDALL_MODEL_KEY - API key for your OpenAI-compatible model endpoint (if running proof)

stages:
  - verify
  - report

.heimdall_base:
  image: golang:1.25-alpine
  variables:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: "local"

heimdall:fast-check:
  extends: .heimdall_base
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - apk add --no-cache git
    - go test -count=1 -coverprofile=coverage.out ./...
    - echo "Coverage profile written to coverage.out for Heimdall diff-coverage evaluation."
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage.out

heimdall:weekly-digest:
  extends: .heimdall_base
  stage: report
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - echo "Run 'heimdall action digest -days 7 -format md' against your state snapshot to publish the shadow & misses digest."
