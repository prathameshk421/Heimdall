# Example heimdall.toml for deploy/compose.yaml. Copy it somewhere outside the repository, then set
# HEIMDALL_CONFIG to the copy. The server checks every key at boot and refuses to start on any error (spec 2.6).
# A value ending in _secret is a file name under secrets_dir, never the credential itself.

# The address inside the container. The compose file publishes it only on 127.0.0.1 of the host (spec 1.3, no ingress).
listen = "0.0.0.0:8080"

# Docker secrets are mounted here inside the container (D89).
secrets_dir = "/run/secrets"

# Personal context cards, <cards_dir>/<person>/<file> (deploy/cards/README.md). Omit to turn read_card off.
cards_dir = "/var/lib/heimdall/cards"

[database]
# Secret file name whose contents are the Postgres URL; the URL itself is never written here.
url_secret = "database_url"

[jira]
# Jira site base URL: https, or http only for a loopback host.
base_url = "https://jira.invalid"
# Tracker project keys this install polls; the slice polls exactly one.
project_keys = ["KAN"]
# Secret file names for the Jira account email and API token.
email_secret = "jira_email"
api_token_secret = "jira_api_token"

[switch]
# Switch gateway base URL: https, or http only for a loopback host.
# Live laptop runs usually tunnel the VM Switch to http://127.0.0.1:8000.
base_url = "http://127.0.0.1:8000"
# The coordinator agent's Switch id, display name and bridge id.
agent_id = "agent-placeholder-1"
agent_name = "heimdall-placeholder"
bridge_id = "bridge-placeholder-1"
# Secret file names for the Switch API key and registration token.
api_key_secret = "switch_api_key"
registration_token_secret = "switch_registration_token"

[github]
# Secret file names for the GitHub App id, installation id and private key (PEM, mode 0600).
app_id_secret = "github_app_id"
installation_id_secret = "github_app_installation_id"
private_key_secret = "github_app_private_key"

# The adapters the server builds. A live run selects all three plus the optional Switch runtime.
[vcs]
provider = "github"

[tracker]
provider = "jira"

[chat]
bridge = "mattermost"

# Optional Switch managed-agent enrollment and host config handoff.
[agent_runtime]
provider = "switchroom"
machine = "heimdall-vm"
mcp_endpoint = "http://127.0.0.1:8080/mcp"
model = "deploy/deepseek-ai/deepseek-v4.1-flash-1017"

# Optional model endpoints. The prefix of agent_runtime.model ("<name>/<model>") picks the endpoint that the
# server's liveness probe and room digest call. Any OpenAI-compatible /chat/completions API works: Ollama, vLLM,
# llama.cpp server, LM Studio, LiteLLM, OpenRouter, DeepSeek or a company gateway. The names "deploy" and
# "openrouter" work without an entry. An entry with the same name replaces them.
#   base_url            API root. https is required. http is allowed on a loopback host, and on a private IP
#                       address when allow_private_http = true.
#   key_file            Secret file name under secrets_dir. Leave it out for an endpoint with no key.
#   headers             Extra request headers. Not secret: keep keys in key_file.
#
# Ollama on the same host, no key (agent_runtime.model = "ollama/qwen2.5-coder:14b"):
# [[model_providers]]
# name = "ollama"
# base_url = "http://127.0.0.1:11434/v1"
#
# LiteLLM gateway with a key (agent_runtime.model = "litellm/gpt-4o"):
# [[model_providers]]
# name = "litellm"
# base_url = "https://litellm.example.com/v1"
# key_file = "litellm_api_key"
# headers = { "X-Team" = "platform" }

# MCP agent identities. Each name needs secrets_dir/agent_token_<name> (0600).
[agents]
test_author = "test-author"
reviewers = ["reviewer-1", "reviewer-2", "reviewer-3"]
resolver = "resolver"

# Optional standing channels. Without [rooms], every change gets its own room. Make the rooms with
# POST /admin/rooms (docs/RUNBOOK.md), then paste their Switch room ids here.
# [rooms]
# tests = "<switch room id of heimdall-tests>"
# reviews = "<switch room id of heimdall-reviews>"

# Optional feeds: more rooms that hear every change's story, for example a Telegram group or a Slack or
# Mattermost channel bridged by Switch. audience is "tests", "review" or "both". Repeat the block per room.
# [[feeds]]
# room_id = "<switch room id>"
# audience = "both"

[[projects]]
tracker_project = "KAN"
repo = "aarush323/PBL_TOS_RISK_ANALYZER"
base_branch = "heimdall-demo"

# The web board (the change list, change pages, review report and live stream). Without this section the server
# does not serve the board at all. With it, every board route needs a sign-in, and only the people listed below get
# in. Sign-in is the OAuth authorization code flow with PKCE.
#   mode                  "oidc" (Okta, Google, Keycloak, Entra ID), "github", or "off" (developer laptop only:
#                         no sign-in, and the server refuses to start unless listen is 127.0.0.1, [::1] or localhost).
#   issuer                oidc only. The issuer URL; the server reads <issuer>/.well-known/openid-configuration.
#   client_id             The client id registered at the provider.
#   client_secret_secret  Secret file name under secrets_dir that holds the client secret.
#   session_key_secret    Secret file name that holds 32 random bytes in base64: openssl rand -base64 32.
#                         It seals the session cookies. A new key signs everyone out.
#   redirect_url          This server's public URL plus /auth/callback. Register the same URL at the provider.
#   session_ttl           How long a sign-in lasts, from "5m" to "24h". Default "8h".
#   login_claim           oidc only. "sub" (default) or "email". The subject is stable for one issuer. An email
#                         can be reassigned to another person, so choose "email" only when you accept that; the
#                         provider must mark it verified.
#   [board_auth.people.<person>]
#                         <person> is the name in the people map of heimdall.yaml. role is viewer, approver or
#                         admin. The identity that proves the person depends on the mode:
#                           oidc    login = the value of the login claim (a subject, or an email with login_claim
#                                   "email").
#                           github  github_id = the number of the GitHub account, not the login. A login can be
#                                   renamed, and another account can then claim the freed name. The number never
#                                   changes. Each person finds theirs with: gh api user --jq .id
#                                   (or open https://api.github.com/users/<login> and read "id").
#                                   A github person with no github_id stops the server at startup. There is no
#                                   fallback to the login, and a login key is refused.
#
# [board_auth]
# mode = "oidc"
# issuer = "https://example.okta.com/oauth2/default"
# client_id = "0oa1b2c3d4heimdall"
# client_secret_secret = "board_client_secret"
# session_key_secret = "board_session_key"
# redirect_url = "https://heimdall.example.com/auth/callback"
# session_ttl = "8h"
# login_claim = "sub"
#
# [board_auth.people.alice]
# login = "00u1a2b3c4alice"
# role = "admin"
#
# [board_auth.people.dana]
# login = "00u5d6e7f8dana"
# role = "viewer"
#
# GitHub instead (an OAuth App, callback URL = redirect_url; people are matched by the numeric id):
# [board_auth]
# mode = "github"
# client_id = "Ov23liExample"
# client_secret_secret = "board_client_secret"
# session_key_secret = "board_session_key"
# redirect_url = "https://heimdall.example.com/auth/callback"
#
# [board_auth.people.alice]
# github_id = 1234567        # from: gh api user --jq .id
# role = "approver"
