version: "2"
# MODULE is replaced with the real module path by `make harness-install` (T16).
# Verify with `golangci-lint config verify`; `make lint-selftest` proves every rule below still fires.
run:
  timeout: 5m
  tests: true
  # Every tag the repo uses, so a file behind a tag is linted like any other (the lintselftest tag is the self-test's own).
  build-tags: [e2e, component, drift, eval, soak, rehearse]

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - gocritic
    - revive
    - gosec
    - bodyclose
    - noctx
    - contextcheck
    - nilerr
    - unparam
    - exhaustive
    - depguard          # R3 dependency rule, R4 no testkit in production
    - forbidigo         # R7
    - gochecknoglobals  # R7
    - gochecknoinits    # R7
    - funlen            # standards section 1
    - gocyclo
    - sloglint
    - testifylint
    - nolintlint        # R2: a //nolint needs a reason and a linter name
  settings:
    funlen:
      lines: 60
      statements: 40
    gocyclo:
      min-complexity: 12
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      no-global: all
      context: all
    forbidigo:
      analyze-types: true   # matches through import aliases and dot imports, not only the literal selector text
      forbid:
        - pattern: ^time\.Sleep$
          msg: "R7: no sleeping. Use the Clock port or a fake clock."
        - pattern: ^time\.(Now|After|Tick|NewTimer|NewTicker|AfterFunc|Since|Until)$
          msg: "R5: read time through the Clock port; only platform, cmd, e2e, testkit and tests may use the real clock."
        - pattern: ^(print|println)$
          msg: "R7: use log/slog."
        - pattern: ^os\.(Stdout|Stderr)$
          msg: "R7: write output through log/slog or a writer passed in."
        - pattern: ^fmt\.(Print|Printf|Println)$
          msg: "R7: use log/slog."
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: "R7: use log/slog."
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv|Clearenv|Setenv|Unsetenv)$
          msg: "R7: configuration is read only in internal/platform/config."
        - pattern: ^syscall\.Getenv$
          msg: "R7: configuration is read only in internal/platform/config."
        - pattern: ^panic$
          msg: "R6: return an error."
    depguard:
      rules:
        domain:
          files: ["**/internal/domain/**", "!**/*_test.go"]   # tests may use testify and cmp (CODING_STANDARDS 8)
          list-mode: strict
          # R5: pure domain. An explicit list, not $gostd, so os, net, os/exec, log and the random packages cannot be imported.
          allow: [errors, fmt, strings, slices, maps, regexp, unicode, unicode/utf8, time, path, strconv, encoding/json, encoding/hex, encoding/binary, crypto/sha256, crypto/sha1, bytes, io, reflect, sort, cmp, MODULE/internal/domain]
          # depguard matches by prefix, so the allowed io and path would also let io/fs, io/ioutil and path/filepath in.
          deny:
            - { pkg: io/fs, desc: "R5: pure domain, no file system" }
            - { pkg: io/ioutil, desc: "R5: pure domain, no file system" }
            - { pkg: path/filepath, desc: "R5: pure domain, use path" }
        app:
          files: ["**/internal/app/**", "!**/*_test.go"]   # tests may use testify and cmp (CODING_STANDARDS 8)
          list-mode: strict
          allow: [$gostd, MODULE/internal/domain, MODULE/internal/ports]
        ports:
          files: ["**/internal/ports/**", "!**/*_test.go"]   # tests may use testify and cmp (CODING_STANDARDS 8)
          list-mode: strict
          allow: [$gostd, MODULE/internal/domain]
        adapters:
          files: ["**/internal/adapters/**"]
          deny:
            - { pkg: MODULE/internal/app, desc: "R3: adapters implement ports, they do not call use cases" }
            - { pkg: MODULE/internal/transport, desc: "R3" }
        transport:
          files: ["**/internal/transport/**"]
          deny:
            - { pkg: MODULE/internal/adapters, desc: "R3: transport calls app, never adapters" }
        production-has-no-testkit:
          files: ["!**/*_test.go", "!**/internal/testkit/**", "!**/cmd/heimdall-testagent/**", "!**/e2e/**"]
          deny:
            - { pkg: MODULE/internal/testkit, desc: "R4: test code stays out of production" }
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, gochecknoglobals, gosec]
      # Owner yes (Nov 7): git names every object by SHA-1, and testset.TreeHash must produce the same tree id as the
      # committed tests. This one file only; it is an identifier, not a security use.
      - path: ^internal/domain/testset/treehash\.go$
        linters: [gosec]
        text: "G(401|505)"
      - path: _test\.go
        linters: [forbidigo]
        text: "(fmt\\.Print|panic|os\\.Getenv|os\\.Std|time\\.(Now|After|Tick|NewTimer|NewTicker|AfterFunc|Since|Until))"
      - path: ^(e2e|internal/testkit)/
        linters: [forbidigo]
        text: "(fmt\\.Print|panic|os\\.(Getenv|LookupEnv)|os\\.Std|time\\.(Now|After|Tick|NewTimer|NewTicker|AfterFunc|Since|Until))"
      - path: ^cmd/
        linters: [forbidigo]
        text: "(fmt\\.Print|panic|os\\.Std|time\\.(Now|After|Tick|NewTimer|NewTicker|AfterFunc|Since|Until))"
      - path: ^internal/platform/
        linters: [forbidigo]
        text: "time\\.(Now|After|Tick|NewTimer|NewTicker|AfterFunc|Since|Until)"
      - path: ^internal/platform/config/
        linters: [forbidigo]
        text: "os\\.(Getenv|LookupEnv)"

issues:
  # A second finding on the same line must not hide the first: a developer would only meet it after fixing the first.
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable: [gofmt, goimports]
