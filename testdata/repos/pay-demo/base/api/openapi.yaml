openapi: 3.0.3
info:
  title: Pay
  version: 1.0.0
paths:
  /payments:
    post:
      summary: Create a payment for the calling merchant
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/MerchantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      responses:
        '201':
          description: The payment was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
components:
  parameters:
    MerchantID:
      name: X-Merchant-ID
      in: header
      required: true
      schema:
        type: string
  responses:
    Error:
      description: The request was rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreatePayment:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in cents
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Payment:
      type: object
      required: [id, merchant_id, amount, currency, created_at]
      properties:
        id:
          type: string
        merchant_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
