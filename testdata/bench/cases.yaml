# Proof Bench dataset (internal/bench doc.go has the rules; docs/sota/BENCH.md has the last validate run).
# change: the intro change (bug) or the merged PR (clean), as the commit on the default branch and its first parent.
# fix: the commit on the default branch that fixed the bug, and its first parent.
# truth: the fix's old-side line spans in Go source, on the fix parent tree (heimdall-bench truth computes them).
# Every SHA was checked with read-only gh api on 2026-11-21, and validate fetches each one again.
version: 1
